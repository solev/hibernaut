# A sleeping laptop answers no keepalives. Azure's image drops a silent client after 3 missed
# ones 120 s apart. sshd keeps the first value it reads, and this file comes before Azure's 50-*.
# 15 missed ones a minute apart last about as long as TCP retries unacknowledged data
# (tcp_retries2), so a session outlasts a sleep of up to about 15 minutes. Each machine's sshd
# waits as long (images/dev/sshd_config).
ClientAliveInterval 60
ClientAliveCountMax 15
